name: CD

on:
  push:
    branches: [main]

jobs:
  package-frontend:
    name: Build and package the website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Keep the built website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: frontend/dist

  # The next steps need a hosting account, which this project does not have yet:
  #   1. Run database/schema.sql on the live database
  #   2. Upload the backend and the website to the host
  # They would be added here as extra jobs, with the host's keys stored in GitHub Secrets.
